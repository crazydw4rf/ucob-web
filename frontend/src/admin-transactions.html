<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Transaksi - Admin UCOB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light admin-layout">
    <nav class="navbar navbar-expand-lg bg-dark sticky-top shadow-sm navbar-dark" id="top-navbar">
      <div class="container-fluid px-4">
        <a class="navbar-brand text-white" href="admin-dashboard.html">
          UC<span class="text-warning">OB</span>
          <span id="admin-badge" class="badge bg-danger ms-2 fs-6">ADMIN</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link text-white-50" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white-50" href="profile.html">Profile</a>
            </li>
            <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
              <a class="btn btn-danger px-4" href="admin-dashboard.html">Admin Panel</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="dashboard-wrapper">
      <aside class="sidebar admin-sidebar d-flex flex-column shadow-sm">
        <h6 class="text-uppercase text-muted fw-bold mb-3 px-3" style="font-size: 0.75rem">Admin Menu</h6>

        <div class="nav flex-column sidebar-nav px-2">
          <a href="admin-dashboard.html" class="nav-link" id="nav-admin-dashboard">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </a>
          <a href="admin-transactions.html" class="nav-link active" id="nav-admin-transactions">
            <i class="bi bi-list-check me-2"></i> Kelola Transaksi
          </a>
          <a href="profile.html" class="nav-link" id="nav-admin-profile">
            <i class="bi bi-person me-2"></i> Profile
          </a>
        </div>

        <div class="mt-auto border-top pt-3 px-3 pb-2 sidebar-profile">
          <div class="d-flex align-items-center mb-3">
            <i class="bi bi-shield-lock-fill text-danger" style="font-size: 2rem"></i>
            <div class="ms-2 overflow-hidden">
              <div class="fw-bold text-truncate" id="sidebar-user-name" style="font-size: 0.95rem">Loading...</div>
              <div class="small text-danger fw-semibold" id="sidebar-user-role">Admin</div>
            </div>
          </div>
          <button class="btn btn-outline-danger btn-sm w-100 btn-logout">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </button>
        </div>
      </aside>

      <main class="dashboard-content">
        <div class="container-fluid gsap-reveal">
          <div class="mb-4">
            <h2 class="fw-bold mb-1">Kelola Transaksi</h2>
            <p class="text-muted mb-0">Semua transaksi dari <code>GET /v1/transaction/admin</code></p>
          </div>

          <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-4">
                  <label class="form-label fw-semibold small text-uppercase text-muted">Filter Status</label>
                  <select class="form-select" id="filter-status">
                    <option value="all">Semua Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Verified">Verified</option>
                    <option value="Rejected">Rejected</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold small text-uppercase text-muted">Filter Tipe</label>
                  <select class="form-select" id="filter-type">
                    <option value="all">Semua Tipe</option>
                    <option value="Sale">Penjualan (Sale)</option>
                    <option value="Purchase">Pembelian (Purchase)</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <div class="small text-muted" id="pagination-info">Memuat...</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                  <thead class="table-light">
                    <tr>
                      <th class="ps-4">ID</th>
                      <th>Tanggal</th>
                      <th>User</th>
                      <th>Tipe</th>
                      <th>Volume</th>
                      <th>Alamat</th>
                      <th>Status</th>
                      <th class="text-end pe-4">Aksi</th>
                    </tr>
                  </thead>
                  <tbody id="admin-transactions-body">
                    <tr>
                      <td colspan="8" class="text-center py-4 text-muted">Memuat data...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between align-items-center">
              <button class="btn btn-outline-secondary btn-sm" id="btn-prev-page">Sebelumnya</button>
              <button class="btn btn-outline-secondary btn-sm" id="btn-next-page">Selanjutnya</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Detail Transaksi <span id="detail-id"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">Tanggal</label>
                <div id="detail-date" class="fw-semibold">-</div>
              </div>
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">User ID</label>
                <div id="detail-user" class="fw-semibold">-</div>
              </div>
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">Tipe Transaksi</label>
                <div id="detail-type">-</div>
              </div>
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">Status</label>
                <div id="detail-status">-</div>
              </div>
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">Volume Minyak</label>
                <div id="detail-volume" class="fw-semibold">-</div>
              </div>
              <div class="col-md-6">
                <label class="small text-muted text-uppercase fw-bold">Estimasi Total</label>
                <div id="detail-total" class="fw-semibold text-success">-</div>
              </div>
              <div class="col-12">
                <label class="small text-muted text-uppercase fw-bold">Alamat</label>
                <div id="detail-address" class="fw-semibold">-</div>
              </div>
              <div class="col-12">
                <label class="small text-muted text-uppercase fw-bold">Payment ID</label>
                <div id="detail-payment" class="text-muted">-</div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin-transactions.js"></script>
  </body>
</html>
